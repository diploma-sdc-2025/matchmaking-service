spring.application.name=matchmaking-service
server.port=${SERVER_PORT:8080}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

# Same secret as auth-service / game-service JWT signing
auth.jwt.secret=${AUTH_JWT_SECRET:dev-change-me-use-long-secret}

# Base URL of game-service (no trailing slash). Docker: http://game-service:8080
game.service.base-url=${GAME_SERVICE_URL:http://localhost:8083}

logging.level.org.java.diploma.service.matchmakingservice=INFO

# Same comma-separated origin patterns as auth-service (env CORS_ALLOWED_ORIGIN_PATTERNS overrides).
cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

# Dev: SPRING_PROFILES_ACTIVE=dev (or local) exposes POST /api/matchmaking/dev/purge-redis (no JWT) to clear
# matchmaking:queue + matchmaking:assigned:*. Stale Redis often causes stuck match ids during local iteration.
